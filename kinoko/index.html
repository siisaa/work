<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>キノコ伝説 仲間ダメージ計算機</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <h1>キノコ伝説 仲間ダメージ計算機</h1>
    <p class="app-header__subtitle">仲間ダメージの期待値を計算します</p>
  </header>

  <nav style="display:flex;justify-content:center;gap:.75rem;padding:.75rem 1rem 0;">
    <a href="./index.html" style="font-size:.82rem;padding:.35rem 1rem;border-radius:9999px;border:1px solid #f59e0b;color:#fbbf24;background:rgba(245,158,11,.1);text-decoration:none;">ダメージ計算</a>
    <a href="./optimize.html" style="font-size:.82rem;padding:.35rem 1rem;border-radius:9999px;border:1px solid rgba(148,163,184,.3);color:#9ca3af;text-decoration:none;">育成最適化</a>
  </nav>

  <main class="app-main">

    <!-- 対戦レイアウト -->
    <div class="battle-field">

      <!-- 自分（攻撃側） -->
      <section class="combatant combatant--attacker">
        <div class="combatant-header">
          <span class="combatant-icon">⚔️</span>
          <h2>自分（攻撃側）</h2>
        </div>
        <div class="stat-list">
          <label class="stat-field">
            <span class="stat-label">攻撃力</span>
            <input id="atk" type="number" inputmode="numeric" placeholder="例: 50000" data-ocr="atk" />
          </label>
          <label class="stat-field">
            <span class="stat-label">仲間ダメージ <small>%</small></span>
            <input id="allyDamage" type="number" inputmode="numeric" placeholder="例: 200" data-ocr="allyDamage" />
          </label>
          <label class="stat-field">
            <span class="stat-label">仲間連撃率 <small>%</small></span>
            <input id="multiRate" type="number" inputmode="numeric" placeholder="例: 30" data-ocr="multiRate" />
          </label>
          <label class="stat-field">
            <span class="stat-label">仲間会心率 <small>%</small></span>
            <input id="critRate" type="number" inputmode="numeric" placeholder="例: 35" data-ocr="critRate" />
          </label>
          <label class="stat-field">
            <span class="stat-label">会心ダメージ <small>%</small></span>
            <input id="critDamage" type="number" inputmode="numeric" placeholder="例: 200" data-ocr="critDamage" />
          </label>
          <label class="stat-field">
            <span class="stat-label">仲間鼓舞 <small>（値）</small></span>
            <input id="inspire" type="number" inputmode="numeric" placeholder="例: 6000" data-ocr="inspire" />
          </label>
          <label class="stat-field">
            <span class="stat-label">仲間回避無視 <small>%</small></span>
            <input id="allyEvadeIgnore" type="number" inputmode="numeric" placeholder="例: 30" data-ocr="allyEvadeIgnore" />
          </label>
          <label class="stat-field">
            <span class="stat-label">回避無視 <small>%</small></span>
            <input id="evadeIgnore" type="number" inputmode="numeric" placeholder="例: 20" data-ocr="evadeIgnore" />
          </label>
        </div>
      </section>

      <div class="vs-divider">VS</div>

      <!-- 相手（防御側） -->
      <section class="combatant combatant--defender">
        <div class="combatant-header">
          <span class="combatant-icon">🛡️</span>
          <h2>相手（防御側）</h2>
        </div>
        <div class="stat-list">
          <label class="stat-field">
            <span class="stat-label">防御力</span>
            <input id="def" type="number" inputmode="numeric" placeholder="例: 30000" data-ocr="def" />
          </label>
          <label class="stat-field">
            <span class="stat-label">仲間ダメ軽減 <small>%</small></span>
            <input id="damageReduction" type="number" inputmode="numeric" placeholder="例: 40" data-ocr="damageReduction" />
          </label>
          <label class="stat-field">
            <span class="stat-label">連撃無視 <small>%</small></span>
            <input id="multiIgnore" type="number" inputmode="numeric" placeholder="例: 10" data-ocr="multiIgnore" />
          </label>
          <label class="stat-field">
            <span class="stat-label">会心無視 <small>%</small></span>
            <input id="critIgnore" type="number" inputmode="numeric" placeholder="例: 10" data-ocr="critIgnore" />
          </label>
          <label class="stat-field">
            <span class="stat-label">会心抵抗 <small>%（未入力=100）</small></span>
            <input id="critResist" type="number" inputmode="numeric" placeholder="例: 100" data-ocr="critResist" />
          </label>
          <label class="stat-field">
            <span class="stat-label">仲間抵抗 <small>（値）</small></span>
            <input id="resist" type="number" inputmode="numeric" placeholder="例: 0" data-ocr="resist" />
          </label>
          <label class="stat-field">
            <span class="stat-label">回避率 <small>%</small></span>
            <input id="evadeRate" type="number" inputmode="numeric" placeholder="例: 30" data-ocr="evadeRate" />
          </label>
        </div>
      </section>
    </div>

    <!-- 仲間編成パターン選択 -->
    <div class="pattern-selector">
      <span class="pattern-label">仲間編成パターン（回避無視の計算方式）</span>
      <div class="pattern-toggle">
        <label class="pattern-option">
          <input type="radio" name="evadePattern" value="A" checked />
          <span>パターンA <small>仲間回避無視 + 回避無視 × 0.4</small></span>
        </label>
        <label class="pattern-option">
          <input type="radio" name="evadePattern" value="B" />
          <span>パターンB <small>仲間回避無視 + 回避無視 × 0.6</small></span>
        </label>
      </div>
    </div>

    <!-- 計算結果 -->
    <section class="result-card" id="resultCard">
      <div id="resultError" class="result-error" aria-live="polite"></div>

      <div class="expected-damage">
        <span class="expected-label">期待ダメージ</span>
        <span class="expected-value" id="expectedDamage">-</span>
      </div>

      <div class="breakdown">
        <div class="breakdown-item">
          <span class="breakdown-label">基本ダメージ</span>
          <span class="breakdown-value" id="baseDamage">-</span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">期待有効ダメ軽減</span>
          <span class="breakdown-value" id="effReduction">-</span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">連撃乗数</span>
          <span class="breakdown-value" id="multiMult">-</span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">会心乗数</span>
          <span class="breakdown-value" id="critMult">-</span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">有効回避率</span>
          <span class="breakdown-value" id="effEvade">-</span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">命中率</span>
          <span class="breakdown-value" id="hitRate">-</span>
        </div>
      </div>
    </section>

    <!-- リセット -->
    <div class="actions">
      <button id="resetButton" class="reset-button">リセット</button>
    </div>

  </main>

  <footer class="app-footer">
    <p>期待ダメ = (攻撃力−防御力) × 仲間ダメ% × (1−有効軽減%) × 連撃乗数 × 会心乗数 × 命中率</p>
  </footer>

  <script src="./main.js"></script>
</body>
</html>
